<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1d">
<title>DAGO FF — Inscription et connexion</title>
<style>
:root{--bg:#080d1d;--panel:#111a30;--line:#293653;--red:#ff304b;--text:#f5f7ff;--muted:#a8b2ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#182747 0,#080d1d 65%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:20px}.logo{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,#ff5368,#a60020);font-size:27px;font-weight:950;box-shadow:0 8px 30px #ff304b33}.brand h1{margin:10px 0 3px;font-size:30px;letter-spacing:2px}.brand h1 span{color:var(--red)}.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:2px}.card{background:#10182bf2;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 22px 65px #0006}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#080d1d;padding:5px;border-radius:12px;margin-bottom:23px}.tab{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:12px 8px;font-size:15px;font-weight:750;cursor:pointer}.tab.active{background:var(--red);color:white}.card h2{margin:0 0 7px;font-size:23px}.hint{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}label{display:block;margin:14px 0 7px;font-size:13px;color:#dce3f4}input{width:100%;padding:14px;border-radius:11px;border:1px solid #354361;background:#090f20;color:white;font-size:16px;outline:none}input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ff304b22}.btn{width:100%;border:0;border-radius:11px;padding:14px;margin-top:17px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,#ff304b,#e51e40);color:white}.google{margin-top:11px;background:#fff;color:#202534;display:flex;align-items:center;justify-content:center;gap:10px}.g{font-size:20px;font-weight:900;color:#4285f4}.or{display:flex;align-items:center;gap:12px;color:#8490a9;font-size:12px;margin-top:16px}.or:before,.or:after{content:"";height:1px;background:#293653;flex:1}.message{display:none;margin-top:13px;padding:11px;border-radius:9px;background:#19263b;color:#dce3f4;font-size:13px;line-height:1.5}.foot{text-align:center;color:#7f8aa3;font-size:11px;margin:18px 5px 0}.hidden{display:none!important}@media(max-width:360px){.card{padding:18px}.brand h1{font-size:26px}}
</style></head><body><main class="wrap"><header class="brand"><div class="logo">FF</div><h1>DAGO <span>FF</span></h1><p>COMMUNAUTÉ FREE FIRE • MADAGASCAR</p></header><section class="card"><div class="tabs"><button class="tab active" id="signupTab" type="button">Inscription</button><button class="tab" id="loginTab" type="button">Se connecter</button></div><form id="authForm"><h2 id="title">Créer un compte</h2><p class="hint" id="hint">Entrez votre adresse e-mail ou numéro mobile.</p><label for="identity">Adresse e-mail ou numéro mobile</label><input id="identity" name="identity" autocomplete="username" placeholder="E-mail ou numéro mobile" required><div id="confirmArea"><label for="password">Créer un mot de passe</label><input id="password" type="password" autocomplete="new-password" placeholder="Mot de passe" minlength="6" required></div><div id="loginPasswordArea" class="hidden"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Votre mot de passe" minlength="6"></div><button class="btn primary" id="submitBtn" type="submit">S'inscrire</button><div class="or">OU</div><button class="btn google" id="googleBtn" type="button"><span class="g">G</span> Continuer avec Google</button><div class="message" id="message" role="status"></div></form></section><p class="foot">DAGO FF © 2026 · Free Fire est une marque de ses propriétaires respectifs.</p></main>
<script>
const signupTab=document.getElementById('signupTab'),loginTab=document.getElementById('loginTab'),title=document.getElementById('title'),hint=document.getElementById('hint'),submitBtn=document.getElementById('submitBtn'),confirmArea=document.getElementById('confirmArea'),loginPasswordArea=document.getElementById('loginPasswordArea'),password=document.getElementById('password'),loginPassword=document.getElementById('loginPassword'),message=document.getElementById('message');let mode='signup';
function setMode(next){mode=next;const signup=mode==='signup';signupTab.classList.toggle('active',signup);loginTab.classList.toggle('active',!signup);title.textContent=signup?'Créer un compte':'Bienvenue';hint.textContent=signup?'Entrez votre adresse e-mail ou numéro mobile.':'Entrez votre adresse e-mail ou numéro mobile pour vous connecter.';submitBtn.textContent=signup?"S'inscrire":'Se connecter';confirmArea.classList.toggle('hidden',!signup);loginPasswordArea.classList.toggle('hidden',signup);password.required=signup;loginPassword.required=!signup;message.style.display='none'}signupTab.addEventListener('click',()=>setMode('signup'));loginTab.addEventListener('click',()=>setMode('login'));
document.getElementById('authForm').addEventListener('submit',e=>{e.preventDefault();message.textContent='L’interface est prête, mais l’inscription et la connexion doivent encore être reliées à un service d’authentification pour fonctionner réellement. Aucun code OTP n’est demandé.';message.style.display='block'});document.getElementById('googleBtn').addEventListener('click',()=>{message.textContent='Le bouton Google est affiché. Pour ouvrir réellement un compte Google, il faut connecter ce site à Firebase Authentication.';message.style.display='block'});
</script></body></html>
